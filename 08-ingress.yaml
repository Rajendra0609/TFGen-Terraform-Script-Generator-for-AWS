apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tfgen-ingress
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-ingress
    app.kubernetes.io/part-of: tfgen
  annotations:
    # Kept for older ingress-nginx versions, but as of ingress-nginx v1.x
    # this annotation alone is IGNORED — spec.ingressClassName below is what
    # actually matters now. Without it, this Ingress may not be picked up by
    # the controller at all, or may silently bind to whatever IngressClass
    # is marked default in your cluster.
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: "tfgen/websocket-headers"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # No TLS/cert-manager annotation is assumed here since issuers vary by
    # cluster. If you use cert-manager, add e.g.:
    #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # and cert-manager will populate the tfgen-tls Secret referenced below
    # automatically. Otherwise, create that Secret yourself:
    #   kubectl create secret tls tfgen-tls --cert=fullchain.pem --key=privkey.pem -n tfgen

spec:
  ingressClassName: nginx
  # No TLS = plaintext HTTP in production, which also means every request
  # (including login credentials and JWTs) crosses the network in the
  # clear. Uncomment once you have a cert (via cert-manager or manually):
  # tls:
  #   - hosts:
  #       - tfgen.example.com
  #     secretName: tfgen-tls
  rules:
    - host: tfgen.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: tfgen-backend
                port:
                  number: 4000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tfgen-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tfgen-frontend
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-headers
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-ingress
    app.kubernetes.io/part-of: tfgen
data:
  Upgrade: "$http_upgrade"
  Connection: "upgrade"
