      label=EXCLUDED.label, schema_def=EXCLUDED.schema_def,
      template_body=EXCLUDED.template_body, module_body=EXCLUDED.module_body;
    
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tfgen-db-init
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-db-init
    app.kubernetes.io/component: init
    app.kubernetes.io/part-of: tfgen
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: tfgen-db-init
        app.kubernetes.io/part-of: tfgen
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait until PostgreSQL is accepting connections before running SQL.
        - name: wait-for-postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h tfgen-postgres-svc -p 5432 -U "$POSTGRES_USER"; do
                echo "  not ready yet, sleeping 3s..."
                sleep 3
              done
              echo "PostgreSQL is ready."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: POSTGRES_USER
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: db-init
          image: postgres:15
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> Applying schema.sql..."
              psql "$DATABASE_URL" -f /sql/schema.sql
              echo "==> Applying seed.sql..."
              psql "$DATABASE_URL" -f /sql/seed.sql
              echo "==> Database initialisation complete."
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: schema-sql
              mountPath: /sql/schema.sql
              subPath: schema.sql
            - name: seed-sql
              mountPath: /sql/seed.sql
              subPath: seed.sql
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: schema-sql
          configMap:
            name: tfgen-schema-sql
        - name: seed-sql
          configMap:
            name: tfgen-seed-sql
