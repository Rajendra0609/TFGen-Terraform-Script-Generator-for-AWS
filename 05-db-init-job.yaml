apiVersion: v1
kind: ConfigMap
metadata:
  name: tfgen-schema-sql
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-db-init
    app.kubernetes.io/part-of: tfgen
data:
  schema.sql: |
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    
    -- ── Migration tracking ────────────────────────────────────────────────────────
    -- Records which migration files have been applied to this database.
    -- Each migration runner (node-pg-migrate, Flyway, or a custom script) should
    -- INSERT a row here after successfully executing a migration file.
    -- This prevents re-running already-applied migrations and makes it possible
    -- to query the current schema version at any time.
    CREATE TABLE IF NOT EXISTS schema_migrations (
      version     VARCHAR(255) PRIMARY KEY,   -- e.g. '001', '002', or a timestamp
      filename    TEXT         NOT NULL,       -- original filename for traceability
      applied_at  TIMESTAMP    NOT NULL DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS users (
      id                     UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      email                  VARCHAR(255) UNIQUE NOT NULL,
      password_hash          TEXT NOT NULL,
      role                   VARCHAR(50) DEFAULT 'user',
      -- FIX: reset_token stores the SHA-256 hash of the raw token (never plaintext).
      -- reset_token_expires_at enforces a 1-hour TTL server-side.
      reset_token            TEXT,
      reset_token_expires_at TIMESTAMP,
      created_at             TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS projects (
      id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name        VARCHAR(255) NOT NULL,
      description TEXT,
      aws_region  VARCHAR(50) DEFAULT 'ap-south-1',
      environment VARCHAR(50) DEFAULT 'dev',
      backend_config JSONB DEFAULT '{}',
      created_at  TIMESTAMP DEFAULT NOW(),
      updated_at  TIMESTAMP DEFAULT NOW(),
      user_id     UUID REFERENCES users(id) ON DELETE CASCADE
    );
    
    CREATE TABLE IF NOT EXISTS resources (
      id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id    UUID REFERENCES projects(id) ON DELETE CASCADE,
      service_type  VARCHAR(100),
      resource_name VARCHAR(255),
      config        JSONB,
      variables     JSONB DEFAULT '{}',
      outputs       JSONB DEFAULT '{}',
      is_module     BOOLEAN DEFAULT false,
      module_source VARCHAR(500),
      hcl_output    TEXT,
      position      INT DEFAULT 0,
      -- FIX: columns required by /api/projects/:id/resources on every save;
      -- previously only added by auto-migration, causing fresh-DB failures.
      lifecycle_config  JSONB    DEFAULT '{}',
      position_x        NUMERIC  DEFAULT 0,
      position_y        NUMERIC  DEFAULT 0,
      annotations       TEXT     DEFAULT '',
      security_findings JSONB    DEFAULT '[]',
      created_at    TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS modules (
      id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name        VARCHAR(255) NOT NULL,
      source      VARCHAR(500),
      version     VARCHAR(50),
      description TEXT,
      schema_def  JSONB,
      created_at  TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS templates (
      id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      service_type  VARCHAR(100) UNIQUE,
      cloud_provider VARCHAR(20) DEFAULT 'aws',
      label         VARCHAR(255),
      category      VARCHAR(100),
      icon          VARCHAR(50),
      is_module     BOOLEAN DEFAULT false,
      schema_def    JSONB,
      template_body TEXT,
      module_body   TEXT,
      data_sources  JSONB DEFAULT '[]',
      updated_at    TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS project_versions (
      id             UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id     UUID REFERENCES projects(id) ON DELETE CASCADE,
      version_number INT,
      full_hcl       TEXT,
      variables_hcl  TEXT,
      outputs_hcl    TEXT,
      resource_count INT DEFAULT 0,
      saved_at       TIMESTAMP DEFAULT NOW()
    );
    -- BUG-007 fix: prevent duplicate version numbers from concurrent saves
    DO $$ BEGIN
      ALTER TABLE project_versions ADD CONSTRAINT uq_project_version UNIQUE (project_id, version_number);
    EXCEPTION WHEN duplicate_table OR duplicate_object THEN NULL; END $$;
    
    CREATE TABLE IF NOT EXISTS validation_logs (
      id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id UUID REFERENCES projects(id) ON DELETE CASCADE,
      is_valid   BOOLEAN,
      diagnostics JSONB,
      ran_at     TIMESTAMP DEFAULT NOW()
    );
    
    -- BUG-022 fix: add index to support future validation-history queries and
    -- prevent sequential scans as the table grows.
    CREATE INDEX IF NOT EXISTS idx_validation_logs_project
      ON validation_logs(project_id, ran_at DESC);
    
    -- Upgrade existing schema when tables already exist
    DO $$
    BEGIN
      ALTER TABLE projects
        ADD COLUMN IF NOT EXISTS environment VARCHAR(50) DEFAULT 'dev';
      ALTER TABLE projects
        ADD COLUMN IF NOT EXISTS backend_config JSONB DEFAULT '{}';
      ALTER TABLE projects
        ADD COLUMN IF NOT EXISTS user_id UUID;
      -- BUG-009 fix: ensure name can never be NULL regardless of migration path
      ALTER TABLE projects ALTER COLUMN name SET NOT NULL;
    EXCEPTION WHEN insufficient_privilege THEN
      RAISE NOTICE 'Skipping ALTER TABLE projects: insufficient privilege or not owner';
    END
    $$;
    
    DO $$
    BEGIN
      ALTER TABLE resources
        ADD COLUMN IF NOT EXISTS variables JSONB DEFAULT '{}';
      ALTER TABLE resources
        ADD COLUMN IF NOT EXISTS outputs JSONB DEFAULT '{}';
      ALTER TABLE resources
        ADD COLUMN IF NOT EXISTS module_source VARCHAR(500);
    EXCEPTION WHEN insufficient_privilege THEN
      RAISE NOTICE 'Skipping ALTER TABLE resources: insufficient privilege or not owner';
    END
    $$;
    
    DO $$
    BEGIN
      ALTER TABLE templates
        ADD COLUMN IF NOT EXISTS data_sources JSONB DEFAULT '[]';
    EXCEPTION WHEN insufficient_privilege THEN
      RAISE NOTICE 'Skipping ALTER TABLE templates: insufficient privilege or not owner';
    END
    $$;
    
    DO $$
    BEGIN
      ALTER TABLE project_versions
        ADD COLUMN IF NOT EXISTS variables_hcl TEXT;
      ALTER TABLE project_versions
        ADD COLUMN IF NOT EXISTS outputs_hcl TEXT;
    EXCEPTION WHEN insufficient_privilege THEN
      RAISE NOTICE 'Skipping ALTER TABLE project_versions: insufficient privilege or not owner';
    END
    $$;
    
    -- ─── Phase-2 schema additions ────────────────────────────────────────────────
    
    -- Refresh tokens for short-lived JWT rotation
    CREATE TABLE IF NOT EXISTS refresh_tokens (
      id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id    UUID REFERENCES users(id) ON DELETE CASCADE,
      token_hash TEXT NOT NULL,           -- SHA-256 hash of token (never store raw)
      expires_at TIMESTAMP NOT NULL,
      revoked    BOOLEAN DEFAULT false,
      created_at TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_user ON refresh_tokens(user_id);
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_hash ON refresh_tokens(token_hash);
    -- BUG-013 fix: partial index so the 6-hour cleanup query (DELETE WHERE revoked=true OR
    -- expires_at < NOW()) and per-user revocation queries can use an index scan instead of
    -- a full sequential scan on large tables.
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_cleanup
      ON refresh_tokens(expires_at) WHERE revoked = false;
    
    -- Project team membership
    CREATE TABLE IF NOT EXISTS project_members (
      id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id  UUID REFERENCES projects(id) ON DELETE CASCADE,
      user_id     UUID REFERENCES users(id) ON DELETE CASCADE,
      role        VARCHAR(50) DEFAULT 'viewer',  -- viewer | editor | deployer
      invited_by  UUID REFERENCES users(id),
      invited_at  TIMESTAMP DEFAULT NOW(),
      accepted_at TIMESTAMP,
      UNIQUE (project_id, user_id)
    );
    CREATE INDEX IF NOT EXISTS idx_project_members_project ON project_members(project_id);
    CREATE INDEX IF NOT EXISTS idx_project_members_user    ON project_members(user_id);
    
    -- Async execution jobs (plan / apply / validate)
    CREATE TABLE IF NOT EXISTS execution_jobs (
      id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id   UUID REFERENCES projects(id) ON DELETE SET NULL,
      user_id      UUID REFERENCES users(id) ON DELETE SET NULL,
      type         VARCHAR(50) NOT NULL,     -- fmt | validate | plan | apply
      status       VARCHAR(50) DEFAULT 'queued',  -- queued | running | succeeded | failed
      hcl_hash     VARCHAR(64),              -- SHA-256 of input HCL for dedup
      plan_summary JSONB DEFAULT '{}',       -- {add, change, destroy, resource_changes[]}
      cost_delta   NUMERIC(12,4),            -- USD/month delta from Infracost
      checkov_summary JSONB DEFAULT '{}',    -- {passed, failed, findings[]}
      log_key      TEXT,                     -- S3 or local path to full log archive
      error        TEXT,
      queued_at    TIMESTAMP DEFAULT NOW(),
      started_at   TIMESTAMP,
      finished_at  TIMESTAMP
    );
    CREATE INDEX IF NOT EXISTS idx_exec_jobs_project ON execution_jobs(project_id);
    CREATE INDEX IF NOT EXISTS idx_exec_jobs_status  ON execution_jobs(status);
    
    -- Audit log for all mutations (SOC-2 / ISO 27001 requirement)
    CREATE TABLE IF NOT EXISTS audit_logs (
      id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id     UUID REFERENCES users(id) ON DELETE SET NULL,
      action      VARCHAR(100) NOT NULL,   -- e.g. project.create, project.delete, apply.trigger
      method      VARCHAR(10),
      path        TEXT,
      ip          VARCHAR(45),
      meta        JSONB DEFAULT '{}',
      status_code INT,
      created_at  TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_audit_logs_user    ON audit_logs(user_id);
    CREATE INDEX IF NOT EXISTS idx_audit_logs_action  ON audit_logs(action);
    CREATE INDEX IF NOT EXISTS idx_audit_logs_created ON audit_logs(created_at DESC);
    
    -- Policy rules (OPA/Rego source for policy-as-code)
    CREATE TABLE IF NOT EXISTS policy_rules (
      id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name        VARCHAR(255) NOT NULL,
      description TEXT,
      rego_source TEXT NOT NULL,            -- Rego policy body
      severity    VARCHAR(20) DEFAULT 'HIGH', -- CRITICAL | HIGH | MEDIUM | LOW
      enabled     BOOLEAN DEFAULT true,
      blocks_plan BOOLEAN DEFAULT false,    -- if true, a violation blocks plan execution
      created_by  UUID REFERENCES users(id) ON DELETE SET NULL,
      created_at  TIMESTAMP DEFAULT NOW(),
      updated_at  TIMESTAMP DEFAULT NOW()
    );
    
    -- Change requests (PR-style reviews)
    CREATE TABLE IF NOT EXISTS change_requests (
      id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id  UUID REFERENCES projects(id) ON DELETE CASCADE,
      version_id  UUID REFERENCES project_versions(id) ON DELETE CASCADE,
      author_id   UUID REFERENCES users(id) ON DELETE SET NULL,
      title       VARCHAR(255),
      description TEXT,
      status      VARCHAR(50) DEFAULT 'open',  -- open | approved | rejected | merged
      approved_by UUID REFERENCES users(id) ON DELETE SET NULL,
      approved_at TIMESTAMP,
      created_at  TIMESTAMP DEFAULT NOW(),
      updated_at  TIMESTAMP DEFAULT NOW()
    );
    
    -- Upgrade project_versions with cost + security snapshot columns
    DO $$
    BEGIN
      ALTER TABLE project_versions
        ADD COLUMN IF NOT EXISTS cost_estimate_usd NUMERIC(12,4);
      ALTER TABLE project_versions
        ADD COLUMN IF NOT EXISTS checkov_passed INT DEFAULT 0;
      ALTER TABLE project_versions
        ADD COLUMN IF NOT EXISTS checkov_failed INT DEFAULT 0;
      ALTER TABLE project_versions
        ADD COLUMN IF NOT EXISTS resource_graph_json JSONB;
      ALTER TABLE project_versions
        ADD COLUMN IF NOT EXISTS saved_by UUID REFERENCES users(id) ON DELETE SET NULL;
      ALTER TABLE project_versions
        ADD COLUMN IF NOT EXISTS change_summary TEXT DEFAULT '';
    EXCEPTION WHEN insufficient_privilege THEN
      RAISE NOTICE 'Skipping ALTER TABLE project_versions phase-2 columns';
    END
    $$;
    
    -- Upgrade resources with canvas position + security findings
    DO $$
    BEGIN
      ALTER TABLE resources
        ADD COLUMN IF NOT EXISTS position_x NUMERIC DEFAULT 0;
      ALTER TABLE resources
        ADD COLUMN IF NOT EXISTS position_y NUMERIC DEFAULT 0;
      ALTER TABLE resources
        ADD COLUMN IF NOT EXISTS security_findings JSONB DEFAULT '[]';
      ALTER TABLE resources
        ADD COLUMN IF NOT EXISTS lifecycle_config JSONB DEFAULT '{}';
      ALTER TABLE resources
        ADD COLUMN IF NOT EXISTS annotations TEXT;
    EXCEPTION WHEN insufficient_privilege THEN
      RAISE NOTICE 'Skipping ALTER TABLE resources phase-2 columns';
    END
    $$;
    
    -- AWS credentials stored per user (encrypted at rest via pgcrypto)
    -- Access key + secret are encrypted with AES-256 using the app's ENCRYPT_KEY
    CREATE TABLE IF NOT EXISTS user_aws_credentials (
      id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id         UUID REFERENCES users(id) ON DELETE CASCADE UNIQUE,
      aws_region      VARCHAR(50)  NOT NULL DEFAULT 'ap-south-1',
      access_key_id   TEXT         NOT NULL,  -- stored as-is; encrypt in application layer
      secret_key_enc  TEXT         NOT NULL,  -- AES-256-GCM encrypted secret
      label           VARCHAR(255) DEFAULT 'My AWS Account',
      verified_at     TIMESTAMP,              -- set when a DescribeCallerIdentity succeeds
      created_at      TIMESTAMP DEFAULT NOW(),
      updated_at      TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_aws_creds_user ON user_aws_credentials(user_id);
    
    -- ─── Phase-3 schema additions ────────────────────────────────────────────────
    
    -- Lab progress tracking for guided scenario labs
    CREATE TABLE IF NOT EXISTS lab_progress (
      id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id    UUID REFERENCES users(id) ON DELETE CASCADE,
      lab_id     VARCHAR(50) NOT NULL,
      step_id    INT NOT NULL,
      completed  BOOLEAN DEFAULT true,
      updated_at TIMESTAMP DEFAULT NOW(),
      UNIQUE(user_id, lab_id, step_id)
    );
    CREATE INDEX IF NOT EXISTS idx_lab_progress_user ON lab_progress(user_id, lab_id);
    
    -- BUG-006 fix: indexes on the two most-queried tables that were missing
    CREATE INDEX IF NOT EXISTS idx_resources_project        ON resources(project_id);
    CREATE INDEX IF NOT EXISTS idx_project_versions_project ON project_versions(project_id);
    
    -- NOTE: Phase-3 ALTER TABLE block removed — all columns were already added
    -- in the Phase-2 DO blocks above with correct types and FK constraints.
    
    -- ─── Phase-5: Password reset columns ────────────────────────────────────────
    -- Added for forgot-password / reset-password flow.
    -- reset_token      : SHA-256 hash of a 64-char hex token (32 random bytes).
    --                    The raw token is sent to the user by email; only the hash
    --                    is persisted so a DB dump cannot be used to take over accounts.
    -- reset_token_expires_at : 1-hour TTL; checked server-side before accepting reset
    DO $$
    BEGIN
      ALTER TABLE users ADD COLUMN IF NOT EXISTS reset_token              TEXT;
      ALTER TABLE users ADD COLUMN IF NOT EXISTS reset_token_expires_at   TIMESTAMP;
    EXCEPTION WHEN insufficient_privilege THEN
      RAISE NOTICE 'Skipping Phase-5 users columns: insufficient privilege';
    END
    $$;
    CREATE INDEX IF NOT EXISTS idx_users_reset_token ON users(reset_token) WHERE reset_token IS NOT NULL;
    
    -- ─── Phase-4: Idempotent safety net — always run these on startup ─────────────
    -- These columns were added in Phase-2 blocks but may not exist if the DB was
    -- initialised from an older version of this file. Adding with IF NOT EXISTS is safe.
    DO $$
    BEGIN
      -- resources: columns required by the /resources save endpoint
      ALTER TABLE resources ADD COLUMN IF NOT EXISTS lifecycle_config  JSONB   DEFAULT '{}';
      ALTER TABLE resources ADD COLUMN IF NOT EXISTS position_x        NUMERIC DEFAULT 0;
      ALTER TABLE resources ADD COLUMN IF NOT EXISTS position_y        NUMERIC DEFAULT 0;
      ALTER TABLE resources ADD COLUMN IF NOT EXISTS annotations       TEXT    DEFAULT '';
      ALTER TABLE resources ADD COLUMN IF NOT EXISTS security_findings JSONB   DEFAULT '[]';
    
      -- project_versions: columns required by the /versions save endpoint
      -- NOTE: resource_count is defined in the CREATE TABLE above; listed here
      --       only as a safety net for DBs migrated from very old schemas.
      ALTER TABLE project_versions ADD COLUMN IF NOT EXISTS cost_estimate_usd NUMERIC(12,4);
      ALTER TABLE project_versions ADD COLUMN IF NOT EXISTS checkov_passed     INT     DEFAULT 0;
      ALTER TABLE project_versions ADD COLUMN IF NOT EXISTS checkov_failed     INT     DEFAULT 0;
      ALTER TABLE project_versions ADD COLUMN IF NOT EXISTS change_summary     TEXT    DEFAULT '';
      ALTER TABLE project_versions ADD COLUMN IF NOT EXISTS saved_by           UUID;
      ALTER TABLE project_versions ADD COLUMN IF NOT EXISTS resource_count     INT     DEFAULT 0;
    EXCEPTION WHEN OTHERS THEN
      RAISE NOTICE 'Phase-4 migration warning: %', SQLERRM;
    END
    $$;
---
# ── ConfigMap: seed.sql ────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: tfgen-seed-sql
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-db-init
    app.kubernetes.io/part-of: tfgen
data:
  seed.sql: |
    -- =============================================================================
    -- Terraform Script Generator — Full AWS Service Seed
    -- Aligned with AWS Cloud Learning Roadmap (DevOps + Admin paths)
    -- =============================================================================
    
    -- ─────────────────────────────────────────────────────────────────────────────
    -- COMPUTE
    -- ─────────────────────────────────────────────────────────────────────────────
    
    INSERT INTO templates (service_type, label, category, icon, schema_def, template_body, module_body) VALUES (
      'ec2', 'EC2 Instance', 'Compute', 'SERVER',
      '[{"id":"name","label":"Resource Name","type":"text","default":"my_ec2","required":true},{"id":"ami_id","label":"AMI ID","type":"text","default":"ami-0c55b159cbfafe1f0","required":true},{"id":"instance_type","label":"Instance Type","type":"select","options":["t2.micro","t2.small","t2.medium","t3.nano","t3.micro","t3.small","t3.medium","t3.large","t3.xlarge","m5.large","m5.xlarge","c5.large","c5.xlarge","r5.large"],"default":"t3.micro"},{"id":"key_name","label":"Key Pair Name","type":"text","default":"my-key-pair"},{"id":"subnet_id","label":"Subnet ID / Reference","type":"text","default":""},{"id":"vpc_security_group_ids","label":"Security Group IDs (comma-sep)","type":"text","default":""},{"id":"associate_public_ip","label":"Associate Public IP","type":"select","options":["true","false"],"default":"true"},{"id":"volume_size","label":"Root Volume Size (GB)","type":"number","default":"20"},{"id":"volume_type","label":"Volume Type","type":"select","options":["gp3","gp2","io1","io2"],"default":"gp3"}]',
      'resource "aws_instance" "{{name}}" {\n  ami                         = "{{ami_id}}"\n  instance_type               = "{{instance_type}}"\n  key_name                    = "{{key_name}}"\n  subnet_id                   = "{{subnet_id}}"\n  associate_public_ip_address = {{associate_public_ip}}\n\n  root_block_device {\n    volume_size = {{volume_size}}\n    volume_type = "{{volume_type}}"\n    encrypted   = true\n  }\n\n  tags = {\n    Name        = "{{name}}"\n    Environment = "{{environment}}"\n    ManagedBy   = "Terraform"\n  }\n}',
      'module "{{name}}" {\n  source        = "terraform-aws-modules/ec2-instance/aws"\n  version       = "~> 5.0"\n\n  name          = "{{name}}"\n  ami           = "{{ami_id}}"\n  instance_type = "{{instance_type}}"\n  key_name      = "{{key_name}}"\n  subnet_id     = "{{subnet_id}}"\n\n  root_block_device = [{\n    volume_size = {{volume_size}}\n    volume_type = "{{volume_type}}"\n    encrypted   = true\n  }]\n\n  tags = {\n    Name        = "{{name}}"\n    Environment = "{{environment}}"\n    ManagedBy   = "Terraform"\n  }\n}'
    ) ON CONFLICT (service_type) DO UPDATE SET
      label=EXCLUDED.label, schema_def=EXCLUDED.schema_def,
      template_body=EXCLUDED.template_body, module_body=EXCLUDED.module_body;
    
    INSERT INTO templates (service_type, label, category, icon, schema_def, template_body, module_body) VALUES (
      'auto_scaling_group', 'Auto Scaling Group', 'Compute', 'AUTOSCALE',
      '[{"id":"name","label":"Resource Name","type":"text","default":"my_asg","required":true},{"id":"ami_id","label":"AMI ID","type":"text","default":"ami-0c55b159cbfafe1f0","required":true},{"id":"instance_type","label":"Instance Type","type":"select","options":["t3.micro","t3.small","t3.medium","t3.large","m5.large"],"default":"t3.micro"},{"id":"min_size","label":"Min Instances","type":"number","default":"1"},{"id":"max_size","label":"Max Instances","type":"number","default":"4"},{"id":"desired_capacity","label":"Desired Capacity","type":"number","default":"2"},{"id":"vpc_zone_identifier","label":"Subnet IDs (comma-sep)","type":"text","default":"aws_subnet.public.id"},{"id":"target_group_arns","label":"ALB Target Group ARN","type":"text","default":""}]',
      'resource "aws_launch_template" "{{name}}" {\n  name_prefix   = "{{name}}-lt-"\n  image_id      = "{{ami_id}}"\n  instance_type = "{{instance_type}}"\n\n  tag_specifications {\n    resource_type = "instance"\n    tags = {\n      Name      = "{{name}}"\n      ManagedBy = "Terraform"\n    }\n  }\n}\n\nresource "aws_autoscaling_group" "{{name}}" {\n  name                = "{{name}}-asg"\n  min_size            = {{min_size}}\n  max_size            = {{max_size}}\n  desired_capacity    = {{desired_capacity}}\n  vpc_zone_identifier = [{{vpc_zone_identifier}}]\n\n  launch_template {\n    id      = aws_launch_template.{{name}}.id\n    version = "$Latest"\n  }\n\n  health_check_type         = "ELB"\n  health_check_grace_period = 300\n\n  tag {\n    key                 = "Name"\n    value               = "{{name}}"\n    propagate_at_launch = true\n  }\n\n  tag {\n    key                 = "Environment"\n    value               = "{{environment}}"\n    propagate_at_launch = true\n  }\n}',
      'module "{{name}}" {\n  source  = "terraform-aws-modules/autoscaling/aws"\n  version = "~> 7.0"\n\n  name = "{{name}}"\n\n  image_id      = "{{ami_id}}"\n  instance_type = "{{instance_type}}"\n\n  min_size         = {{min_size}}\n  max_size         = {{max_size}}\n  desired_capacity = {{desired_capacity}}\n\n  vpc_zone_identifier = [{{vpc_zone_identifier}}]\n\n  tags = {\n    Environment = "{{environment}}"\n    ManagedBy   = "Terraform"\n  }\n}'
    ) ON CONFLICT (service_type) DO UPDATE SET
      label=EXCLUDED.label, schema_def=EXCLUDED.schema_def,
      template_body=EXCLUDED.template_body, module_body=EXCLUDED.module_body;
    
    INSERT INTO templates (service_type, label, category, icon, schema_def, template_body, module_body) VALUES (
      'alb', 'Application Load Balancer', 'Compute', 'LOADBALANCER',
      '[{"id":"name","label":"Resource Name","type":"text","default":"my_alb","required":true},{"id":"alb_name","label":"ALB Name","type":"text","default":"my-app-alb","required":true},{"id":"internal","label":"Internal (private)","type":"select","options":["false","true"],"default":"false"},{"id":"listener_port","label":"Listener Port","type":"number","default":"80"},{"id":"listener_protocol","label":"Listener Protocol","type":"select","options":["HTTP","HTTPS"],"default":"HTTP"},{"id":"target_port","label":"Target Port","type":"number","default":"80"},{"id":"target_protocol","label":"Target Protocol","type":"select","options":["HTTP","HTTPS"],"default":"HTTP"},{"id":"vpc_id","label":"VPC ID / Reference","type":"text","default":"aws_vpc.my_vpc.id","required":true},{"id":"subnet_ids","label":"Subnet IDs (comma-sep)","type":"text","default":"aws_subnet.public_a.id, aws_subnet.public_b.id"}]',
      'resource "aws_lb" "{{name}}" {\n  name               = "{{alb_name}}"\n  internal           = {{internal}}\n  load_balancer_type = "application"\n  subnets            = [{{subnet_ids}}]\n\n  enable_deletion_protection = false\n\n  tags = {\n    Name        = "{{alb_name}}"\n    Environment = "{{environment}}"\n    ManagedBy   = "Terraform"\n  }\n}\n\nresource "aws_lb_target_group" "{{name}}" {\n  name     = "{{alb_name}}-tg"\n  port     = {{target_port}}\n  protocol = "{{target_protocol}}"\n  vpc_id   = {{vpc_id}}\n\n  health_check {\n    path                = "/"\n    healthy_threshold   = 2\n    unhealthy_threshold = 2\n  }\n\n  tags = { ManagedBy = "Terraform" }\n}\n\nresource "aws_lb_listener" "{{name}}" {\n  load_balancer_arn = aws_lb.{{name}}.arn\n  port              = {{listener_port}}\n  protocol          = "{{listener_protocol}}"\n\n  default_action {\n    type             = "forward"\n    target_group_arn = aws_lb_target_group.{{name}}.arn\n  }\n}',
      'module "{{name}}" {\n  source  = "terraform-aws-modules/alb/aws"\n  version = "~> 9.0"\n\n  name    = "{{alb_name}}"\n  vpc_id  = {{vpc_id}}\n  subnets = [{{subnet_ids}}]\n\n  internal = {{internal}}\n\n  tags = {\n    Environment = "{{environment}}"\n    ManagedBy   = "Terraform"\n  }\n}'
    ) ON CONFLICT (service_type) DO UPDATE SET
      label=EXCLUDED.label, schema_def=EXCLUDED.schema_def,
      template_body=EXCLUDED.template_body, module_body=EXCLUDED.module_body;
    
    INSERT INTO templates (service_type, label, category, icon, schema_def, template_body, module_body) VALUES (
      'lambda', 'Lambda Function', 'Compute', 'FUNCTION',
      '[{"id":"name","label":"Resource Name","type":"text","default":"my_lambda","required":true},{"id":"function_name","label":"Function Name","type":"text","default":"my-function","required":true},{"id":"runtime","label":"Runtime","type":"select","options":["python3.12","python3.11","python3.10","nodejs20.x","nodejs18.x","java21","java17","go1.x","dotnet8"],"default":"python3.11"},{"id":"handler","label":"Handler","type":"text","default":"index.handler"},{"id":"timeout","label":"Timeout (seconds)","type":"number","default":"30"},{"id":"memory_size","label":"Memory Size (MB)","type":"select","options":["128","256","512","1024","2048","3008"],"default":"256"},{"id":"s3_bucket","label":"S3 Bucket (code source)","type":"text","default":"my-lambda-code-bucket"},{"id":"s3_key","label":"S3 Key (zip file)","type":"text","default":"function.zip"}]',
      'resource "aws_iam_role" "{{name}}" {\n  name = "{{function_name}}-role"\n\n  assume_role_policy = jsonencode({\n    Version = "2012-10-17"\n    Statement = [{\n      Action    = "sts:AssumeRole"\n      Effect    = "Allow"\n      Principal = { Service = "lambda.amazonaws.com" }\n    }]\n  })\n}\n\nresource "aws_iam_role_policy_attachment" "{{name}}_basic" {\n  role       = aws_iam_role.{{name}}.name\n  policy_arn = "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"\n}\n\nresource "aws_lambda_function" "{{name}}" {\n  function_name = "{{function_name}}"\n  runtime       = "{{runtime}}"\n  handler       = "{{handler}}"\n  timeout       = {{timeout}}\n  memory_size   = {{memory_size}}\n  role          = aws_iam_role.{{name}}.arn\n\n  s3_bucket = "{{s3_bucket}}"\n  s3_key    = "{{s3_key}}"\n\n  tags = {\n    Name        = "{{function_name}}"\n    Environment = "{{environment}}"\n    ManagedBy   = "Terraform"\n  }\n}',
      'module "{{name}}" {\n  source  = "terraform-aws-modules/lambda/aws"\n  version = "~> 7.0"\n\n  function_name = "{{function_name}}"\n  runtime       = "{{runtime}}"\n  handler       = "{{handler}}"\n  timeout       = {{timeout}}\n  memory_size   = {{memory_size}}\n\n  create_package      = false\n  s3_existing_package = {\n    bucket = "{{s3_bucket}}"\n    key    = "{{s3_key}}"\n  }\n\n  tags = {\n    Name        = "{{function_name}}"\n    Environment = "{{environment}}"\n    ManagedBy   = "Terraform"\n  }\n}'
    ) ON CONFLICT (service_type) DO UPDATE SET
      label=EXCLUDED.label, schema_def=EXCLUDED.schema_def,
      template_body=EXCLUDED.template_body, module_body=EXCLUDED.module_body;
    
