apiVersion: v1
kind: Service
metadata:
  name: tfgen-frontend
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tfgen
spec:
  type: ClusterIP
  selector:
    app: tfgen-frontend
  ports:
    - name: http
      port: 80
      # FIXED: nginx in this image runs as a non-root user and therefore
      # can't bind port 80 (privileged) — it listens on 8080 (see
      # frontend/Dockerfile `EXPOSE 8080` + nginx.conf `listen 8080`). This
      # was pointed at 80, where nothing was listening — every request
      # would have failed.
      targetPort: 8080
      protocol: TCP
---
# ── Deployment ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfgen-frontend
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tfgen
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: tfgen-frontend
  template:
    metadata:
      labels:
        app: tfgen-frontend
        app.kubernetes.io/name: tfgen-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: tfgen
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: daggu1997/tfgen_frontend:v0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              # FIXED: was 80 — nginx actually listens on 8080 in this image.
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
