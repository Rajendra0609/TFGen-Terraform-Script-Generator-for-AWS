apiVersion: v1
kind: Service
metadata:
  name: tfgen-redis
  namespace: tfgen
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tfgen
spec:
  clusterIP: None
  selector:
    app: tfgen-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---

apiVersion: v1
kind: Service
metadata:
  name: tfgen-redis-svc
  namespace: tfgen
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tfgen
spec:
  type: ClusterIP
  selector:
    app: tfgen-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tfgen-redis
  namespace: tfgen
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tfgen
spec:
  serviceName: tfgen-redis
  replicas: 1
  selector:
    matchLabels:
      app: tfgen-redis
  template:
    metadata:
      labels:
        app: tfgen-redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: tfgen
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # CORRECTED after reading redis's actual upstream alpine Dockerfile:
        #   addgroup -S -g 1000 redis   # alpine already has a gid 999 taken,
        #                               # so the *group* had to become 1000
        #   adduser  -S -G redis -u 999 redis
        # i.e. the redis USER is uid 999, but its GROUP is gid 1000 — an
        # asymmetric pair, not 999/999 like the Debian image. runAsGroup and
        # fsGroup both need to be 1000 for volume permissions to actually
        # line up; the previous fsGroup: 999 here was silently wrong (would
        # likely have surfaced as an AOF/RDB permission error on /data, a
        # separate failure after the runAsNonRoot one you already hit).
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # FIXED: was `redis:7` (Debian-based) — docker-compose.yml (the
          # actual tested/intended deployment) uses `redis:7-alpine`.
          # Switched to match, and the uid/gid above are pinned specifically
          # for the alpine variant (see securityContext comment above) — if
          # you ever switch back to a Debian tag, these need to change too
          # (Debian's redis user is a plain 999/999, no asymmetry).
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # FIXED: this used to start Redis with no authentication at all —
          # `redis://tfgen-redis-svc:6379` (see 02-secret.yaml) was reachable,
          # unauthenticated, from any pod in the cluster that could resolve
          # the Service. `--requirepass $(REDIS_PASSWORD)` below pulls the
          # password from the env var Kubernetes substitutes into `command`/
          # `args` from the secretKeyRef right below it.
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --save
            - "60"
            - "1"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: redisdata
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              # FIXED: `redis-cli ping` alone would now fail with
              # "NOAUTH Authentication required" once --requirepass is set.
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: redisdata
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/part-of: tfgen
      spec:
        accessModes:
          - ReadWriteOnce
        # FIXED: same issue as pgdata in 03-postgres-statefulset.yaml — no
        # storageClassName and no default StorageClass in the cluster meant
        # this PVC could never bind. See 00b-storage-local-path.yaml.
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
