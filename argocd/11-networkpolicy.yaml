
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tfgen
  labels:
    app.kubernetes.io/part-of: tfgen
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: tfgen
  labels:
    app.kubernetes.io/part-of: tfgen
spec:
  podSelector:
    matchLabels:
      app: tfgen-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Traffic from the ingress-nginx controller. The exact labels depend
        # on how ingress-nginx was installed — this matches the common Helm
        # chart defaults. Check with:
        #   kubectl get pods -n ingress-nginx --show-labels
        # and adjust if yours differ.
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: tfgen
  labels:
    app.kubernetes.io/part-of: tfgen
spec:
  podSelector:
    matchLabels:
      app: tfgen-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: tfgen
  labels:
    app.kubernetes.io/part-of: tfgen
spec:
  # ADDED: found while tracing through the "backend" Service alias fix in
  # 06-backend-deployment.yaml. frontend/nginx.conf proxies /api/ and /ws/
  # to http://backend:4000 — that Service alias makes the DNS name resolve,
  # but without this rule the connection would still be silently dropped
  # here, since previously only ingress-nginx→backend was ever allowed.
  # ingress-nginx routes /api and /ws directly to tfgen-backend and never
  # touches the frontend pod on the main documented path, so this gap was
  # invisible there — but it would have blocked the frontend pod's own
  # /api and /ws proxying whenever something talks to the frontend
  # Service/pod directly, e.g. this README's `kubectl port-forward
  # svc/tfgen-frontend ...` local-testing step.
  podSelector:
    matchLabels:
      app: tfgen-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tfgen-frontend
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-postgres
  namespace: tfgen
  labels:
    app.kubernetes.io/part-of: tfgen
spec:
  podSelector:
    matchLabels:
      app: tfgen-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tfgen-backend
        # The db-init Job's pods carry this label (see 05-db-init-job.yaml)
        - podSelector:
            matchLabels:
              app: tfgen-db-init
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-redis
  namespace: tfgen
  labels:
    app.kubernetes.io/part-of: tfgen
spec:
  podSelector:
    matchLabels:
      app: tfgen-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tfgen-backend
      ports:
        - protocol: TCP
          port: 6379
