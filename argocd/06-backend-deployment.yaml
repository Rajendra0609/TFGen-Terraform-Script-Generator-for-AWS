apiVersion: v1
kind: Service
metadata:
  name: tfgen-backend
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tfgen
spec:
  type: ClusterIP
  selector:
    app: tfgen-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
---
# FIXED (found by reading frontend/nginx.conf, which is baked into the
# frontend image at build time and can't be changed from the k8s manifest
# side): its /api/ and /ws/ location blocks do
#   proxy_pass http://backend:4000;
# — "backend" is the Docker Compose service name this was written for. In
# this namespace the real Service is named "tfgen-backend", so "backend"
# doesn't resolve via cluster DNS at all. 08-ingress.yaml happens to route
# /api and /ws directly to tfgen-backend, bypassing the frontend pod
# entirely for the main documented path, which is why this hasn't shown up
# as pods crashing — but anything that talks to the frontend Service/pod
# directly (e.g. this README's own `kubectl port-forward svc/tfgen-frontend
# ...` verification step) hits an unresolvable hostname and every /api and
# /ws call from that frontend pod fails, silently, with all pods still
# reporting Running/Ready. This second Service is a plain alias — same
# selector/port as tfgen-backend above — that exists purely so the
# hardcoded hostname resolves. Long-term, better fix is to template
# nginx.conf at container start (envsubst + BACKEND_HOST env var) instead of
# baking a hostname into the image, but that requires touching
# frontend/Dockerfile and rebuilding; this is the zero-rebuild fix.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tfgen
spec:
  type: ClusterIP
  selector:
    app: tfgen-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfgen-backend
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tfgen
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: tfgen-backend
  template:
    metadata:
      labels:
        app: tfgen-backend
        app.kubernetes.io/name: tfgen-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: tfgen
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # ADDED: backend/Dockerfile's `USER appuser` is a named user with no
        # pinned uid, which hits the exact same "cannot verify user is
        # non-root" rejection the frontend nginx image did — runAsNonRoot
        # alone was never going to be enough here either, it just hadn't
        # been reached yet (initContainers run first, and were failing).
        #
        # UNLIKE nginx/postgres/redis, this uid could NOT be determined by
        # reading the Dockerfile — Alpine's `adduser -S appuser` with no
        # explicit `-u` auto-assigns the next free system uid at BUILD time,
        # which depends on exactly what's already in that image layer and
        # isn't something you can reliably read off the Dockerfile source.
        # Guessing wrong here is worse than the scheduling failure you
        # already saw: it schedules fine and then fails inside the app with
        # confusing permission errors reading /app, because /app was chowned
        # at build time to whichever number actually got assigned.
        #
        # So backend/Dockerfile itself was patched to pin this explicitly
        # (see the patched copy alongside this manifest) instead of guessed
        # here — `adduser -u 1001 ... appuser`. That match is only real once
        # the image is rebuilt and pushed as v0.0.3 — see the note on the
        # `backend` container's `image:` line below. Don't apply this
        # against the existing v0.0.2 image; its appuser uid is whatever
        # Alpine happened to auto-assign and is NOT 1001.
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-postgres
          image: daggu1997/tfgen_postgres:051386f1
          imagePullPolicy: IfNotPresent
          # FIXED: kubelet rejected this with "container has runAsNonRoot and
          # image will run as root". Unlike 03-postgres-statefulset.yaml
          # (which runs the image's real docker-entrypoint.sh, needing root
          # briefly to chown the data dir before it drops to the postgres
          # user itself), this initContainer overrides `command` to just
          # call pg_isready — entrypoint.sh, and its privilege drop, never
          # runs. It inherits the pod-level `runAsNonRoot: true` with no
          # override, so it's asked to run as the image's default user,
          # which is root. Pinning the postgres user here is enough —
          # pg_isready needs no special privileges.
          #
          # CORRECTED (was uid 999): database/Dockerfile is `FROM
          # postgres:15-alpine`. Alpine's postgres image pins uid/gid 70 for
          # the postgres user — 999 is the *Debian* image's convention and
          # was wrong for this image. Verified against docker-library/
          # postgres's Dockerfile-alpine.template:
          #   addgroup -g 70 -S postgres; adduser -u 70 -S -D -G postgres ...
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z tfgen-postgres-svc 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: POSTGRES_USER
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        - name: wait-for-redis
          # FIXED: was `redis:7` (Debian) — docker-compose.yml (the actual
          # tested deployment) uses `redis:7-alpine`. Switched to match
          # 04-redis-statefulset.yaml, which now uses the same tag.
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # FIXED preemptively: same root cause as wait-for-postgres above —
          # this wasn't in your error log yet only because initContainers
          # run in sequence and wait-for-postgres was failing first. The
          # official redis image has the identical shape (root by default,
          # docker-entrypoint.sh drops privileges, and this initContainer's
          # overridden `command` skips that entrypoint).
          #
          # uid 999 / gid 1000 verified against redis's actual upstream
          # alpine Dockerfile (note the asymmetry — alpine already reserves
          # gid 999 for something else, so redis's *group* became 1000 while
          # its *user* stayed 999):
          #   addgroup -S -g 1000 redis; adduser -S -G redis -u 999 redis
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z tfgen-redis-svc 6379; do
                echo "Waiting for Redis..."; sleep 3
              done
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: backend
          # Reverted to the previously published backend image tag requested
          # for this deployment.
          image: daggu1997/tfgen_backend:051386f1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tfgen-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: JWT_REFRESH_SECRET
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: ENCRYPT_KEY
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: SMTP_FROM
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: FRONTEND_URL
          # REMOVED — CRITICAL SECURITY FIX: this container used to mount
          # /var/run/docker.sock straight from the node via a hostPath
          # volume. In Kubernetes, that's not the same risk-tradeoff it is
          # in a single-host docker-compose setup — anything that can reach
          # a node's Docker socket can launch a --privileged container with
          # the node's root filesystem bind-mounted in, which is a full node
          # compromise (and from there, frequently a full cluster
          # compromise via that node's kubelet credentials). This app
          # doesn't need it to function: backend/Dockerfile already bundles
          # real `terraform`/`terraform-ls` binaries (binary mode — no
          # Docker involved at all for plan/validate/fmt/LSP), and
          # backend/utils/dockerAvailable.js's isDockerAvailable() is
          # checked before every Docker-fallback call (checkov.js,
          # infracost.js, runner.js) and fails soft, not hard, when Docker
          # isn't reachable — confirmed by reading through that code path.
          #
          # Tradeoff: Checkov security-scanning and Infracost cost-estimates
          # have no local-binary alternative in this codebase today, so
          # those two specific features will report "unavailable" in this
          # cluster until one of the following is done (neither needs a
          # node-level docker.sock):
          #   (a) install the real `checkov` (pip) and `infracost` CLI
          #       binaries directly into backend/Dockerfile — the correct
          #       long-term fix, removes the Docker dependency entirely; or
          #   (b) run a locked-down docker-socket-proxy (e.g. Tecnativa) as
          #       its own Deployment in this namespace and point DOCKER_HOST
          #       at it over TCP — mirrors docker-compose.yml's approach,
          #       but still only as safe as whatever node that proxy itself
          #       runs on, so (a) is strongly preferred for Kubernetes.
          # Happy to wire up (a) in the Dockerfile if you want that feature
          # parity — just ask.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20   
