apiVersion: v1
kind: Service
metadata:
  name: tfgen-redis
  namespace: tfgen
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tfgen
spec:
  clusterIP: None
  selector:
    app: tfgen-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---

apiVersion: v1
kind: Service
metadata:
  name: tfgen-redis-svc
  namespace: tfgen
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tfgen
spec:
  type: ClusterIP
  selector:
    app: tfgen-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tfgen-redis
  namespace: tfgen
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tfgen
spec:
  serviceName: tfgen-redis
  replicas: 1
  selector:
    matchLabels:
      app: tfgen-redis
  template:
    metadata:
      labels:
        app: tfgen-redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: tfgen
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # FIXED: this used to start Redis with no authentication at all —
          # `redis://tfgen-redis-svc:6379` (see 02-secret.yaml) was reachable,
          # unauthenticated, from any pod in the cluster that could resolve
          # the Service. `--requirepass $(REDIS_PASSWORD)` below pulls the
          # password from the env var Kubernetes substitutes into `command`/
          # `args` from the secretKeyRef right below it.
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --save
            - "60"
            - "1"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: redisdata
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              # FIXED: `redis-cli ping` alone would now fail with
              # "NOAUTH Authentication required" once --requirepass is set.
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: redisdata
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/part-of: tfgen
      spec:
        accessModes:
          - ReadWriteOnce
        # storageClassName: gp3
        resources:
          requests:
            storage: 5Gi
