apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tfgen-backend-hpa
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-backend-hpa
    app.kubernetes.io/part-of: tfgen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tfgen-backend
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# ── Frontend HPA ────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tfgen-frontend-hpa
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen-frontend-hpa
    app.kubernetes.io/part-of: tfgen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tfgen-frontend
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
