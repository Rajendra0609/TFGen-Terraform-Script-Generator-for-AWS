apiVersion: v1
kind: ConfigMap
metadata:
  name: tfgen-config
  namespace: tfgen
  labels:
    app.kubernetes.io/name: tfgen
    app.kubernetes.io/part-of: tfgen
data:
  PORT: "4000"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  JWT_ACCESS_EXPIRY: "1h"
  JWT_REFRESH_EXPIRY: "7d"
  # Allow browser requests from the frontend ingress host used in this
  # deployment. This matches the host routed by 08-ingress.yaml, including
  # both HTTPS and plain HTTP access through the ingress.
  CORS_ORIGIN: "http://tfgen.example.com,https://tfgen.example.com,http://192.168.194.78:8080,http://tfgen-frontend:80"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "200"
  RATE_LIMIT_TRUSTED_IPS: "*"
  TRUST_PROXY: "1"
  AWS_REGION: "us-east-1"
  DEFAULT_AWS_REGION: "us-east-1"
  SKIP_STS_VERIFY: "false"
  AWS_STS_ENDPOINT: ""
  TERRAFORM_PATH: "/usr/local/bin/terraform"
  TF_DOCKER_IMAGE: "hashicorp/terraform:1.7"
  TF_LSP_PATH: ""
  JOB_CONCURRENCY: "3"
  CHECKOV_IMAGE: "bridgecrew/checkov:latest"
  BLOCK_PLAN_ON_CRITICAL: "true"
  INFRACOST_API_KEY: ""
  INFRACOST_IMAGE: "infracost/infracost:ci-0.10"
  OPA_PATH: "/usr/local/bin/opa"
  # FIXED: this used to hardcode TF_DOCKER_IMAGE to a mutable tag
  # ("hashicorp/terraform:1.15"), which silently overrode
  # backend/terraform/runner.js's own digest-pinned default — the exact
  # thing BUG-011/SECURITY FIX (L-06) in that file exists to prevent (a
  # mutable tag can change under you between pod restarts with no warning).
  # Deliberately left unset here so the app's verified digest pin applies.
  # If you do need to override it, pin by digest, not by tag:
  #   TF_DOCKER_IMAGE: "hashicorp/terraform@sha256:<verified-digest>"
  # ⚠️ This ConfigMap shipped with SKIP_STS_VERIFY=false, but the project's
  # own README for this deployment says it should be "true" because pods in
  # a cluster with no NAT gateway can't reach sts.amazonaws.com and the
  # verification call will just fail/slow down startup. Decide this based on
  # YOUR cluster's egress, don't cargo-cult either value:
  #   false → backend verifies AWS creds against STS at startup (safer, but
  #           requires outbound internet access from pods)
  #   true  → skips that check entirely (needed if pods have no NAT/egress)
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  FRONTEND_URL: "https://tfgen.example.com"
  
