apiVersion: v1
kind: Service
metadata:
  name: tfgen-postgres
  namespace: tfgen
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tfgen
spec:
  clusterIP: None
  selector:
    app: tfgen-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---

apiVersion: v1
kind: Service
metadata:
  name: tfgen-postgres-svc
  namespace: tfgen
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tfgen
spec:
  type: ClusterIP
  selector:
    app: tfgen-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tfgen-postgres
  namespace: tfgen
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tfgen
spec:
  serviceName: tfgen-postgres
  replicas: 1
  selector:
    matchLabels:
      app: tfgen-postgres
  template:
    metadata:
      labels:
        app: tfgen-postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: tfgen
    spec:
      terminationGracePeriodSeconds: 60
      # Nothing in this pod talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        # CORRECTED: database/Dockerfile (now that it's been reviewed
        # directly) is `FROM postgres:15-alpine` — the ALPINE variant, not
        # Debian. This matters: Alpine's postgres image pins uid/gid 70 for
        # the `postgres` user ("70 is the standard uid/gid for postgres in
        # Alpine" — docker-library/postgres's Dockerfile-alpine.template).
        # The Debian variant uses 999 instead, which is where the previous
        # value here came from — wrong image family. Confirmed against the
        # upstream Dockerfile:
        #   addgroup -g 70 -S postgres
        #   adduser  -u 70 -S -D -G postgres -H -h /var/lib/postgresql postgres
        # The entrypoint still needs to run as root briefly to chown/init the
        # data directory before dropping to uid 70 itself — so we set
        # fsGroup (for volume group-ownership) but do NOT force
        # runAsNonRoot/runAsUser at the pod level, which would break that
        # entrypoint.
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: daggu1997/tfgen_postgres:051386f1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tfgen-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: run-postgresql
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: run-postgresql
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: tfgen
      spec:
        accessModes:
          - ReadWriteOnce
        # FIXED: this had no storageClassName, and the cluster had no
        # default StorageClass either — that's why this PVC sat Pending
        # ("unbound immediate PersistentVolumeClaims") and blocked the pod
        # from scheduling. 00b-storage-local-path.yaml installs
        # local-path-provisioner and this pins to it explicitly. If you're
        # on a cluster with a real dynamic provisioner instead (EKS, GKE,
        # etc.), swap this for that StorageClass name, e.g.:
        #   storageClassName: gp3        # AWS EKS
        #   storageClassName: standard   # GKE / minikube / k3s
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
